name: Build VideoStarTool HSON 3 Features v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Locate project and verify required files
        shell: bash
        run: |
          set -euo pipefail
          MAKEFILE_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name Makefile -not -path '*/.theos/*' -print -quit)"
          if [[ -z "$MAKEFILE_PATH" ]]; then
            echo "ERROR: Makefile not found. Upload the project files or extract VideoStarTool_HSON_3Features_v5 into the repository." >&2
            exit 1
          fi

          PROJECT_DIR="${MAKEFILE_PATH%/Makefile}"
          for REQUIRED_FILE in control HSONModernMenu.plist Source/Tweak.m Source/Features/HSONFeatureEngine.m Source/Features/HSONFeatureEngine.h; do
            if [[ ! -f "$PROJECT_DIR/$REQUIRED_FILE" ]]; then
              echo "ERROR: Missing $PROJECT_DIR/$REQUIRED_FILE" >&2
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"

          if [[ ! -f "$THEOS/makefiles/common.mk" ]]; then
            rm -rf "$THEOS"
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          else
            git -C "$THEOS" submodule update --init --recursive
          fi

          SDK_DIR="$THEOS/sdks"
          mkdir -p "$SDK_DIR"
          SDK_FOUND="$(find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit)"

          if [[ -z "$SDK_FOUND" ]]; then
            SDK_REPO="$RUNNER_TEMP/theos-sdks"
            rm -rf "$SDK_REPO"
            git clone --depth 1 https://github.com/theos/sdks.git "$SDK_REPO"
            find "$SDK_REPO" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -exec cp -R {} "$SDK_DIR/" \;
          fi

          SDK_FOUND="$(find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit)"
          if [[ -z "$SDK_FOUND" ]]; then
            echo "ERROR: No iOS SDK found in $SDK_DIR" >&2
            exit 1
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK_FOUND"

      - name: Build rootless ARM64 package
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          make --version
          make clean
          make package FINALPACKAGE=1

      - name: Collect build outputs & Embed CodeSignature
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p "$RELEASE_DIR"

          find .theos/obj -type f -name 'HSONModernMenu.dylib' -exec cp {} "$RELEASE_DIR/" \;
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} "$RELEASE_DIR/" \;

          DYLIB_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name 'HSONModernMenu.dylib' -print -quit)"
          DEB_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.deb' -print -quit)"

          if [[ -z "$DYLIB_PATH" ]]; then
            echo "ERROR: HSONModernMenu.dylib was not generated" >&2
            exit 1
          fi
          if [[ -z "$DEB_PATH" ]]; then
            echo "ERROR: Theos .deb package was not generated" >&2
            exit 1
          fi

          # Nhúng sẵn ad-hoc LC_CODE_SIGNATURE để zsign, ESign, Scarlet, Sideloadly ký 100% không bị tràn LoadCommands
          codesign -f -s - "$DYLIB_PATH" || ldid -S "$DYLIB_PATH" || true

          file "$DYLIB_PATH"
          lipo -info "$DYLIB_PATH"
          codesign -dvvv "$DYLIB_PATH" 2>&1 || true
          otool -l "$DYLIB_PATH" | grep -A 4 LC_CODE_SIGNATURE || true
          ls -lh "$RELEASE_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-HSON-3Features-v5-arm64
          path: release/*
          if-no-files-found: error
